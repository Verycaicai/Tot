<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; img-src file: mdfile: data:; font-src file: data:">
  <title>Tot</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>

  <header id="topbar">
    <div id="searchbar" hidden>
      <input id="search-input" type="text" placeholder="查找（大小写不敏感）">
      <span id="search-count"></span>
      <button id="search-prev" title="上一个 (Shift+Enter)">↑</button>
      <button id="search-next" title="下一个 (Enter)">↓</button>
      <button id="search-close" title="关闭 (Esc)">×</button>
    </div>
    <div id="controls">
      <span id="save-status"></span>
      <button id="edit-toggle" disabled title="编辑当前文档">编辑</button>
      <button id="save-btn" disabled title="保存当前文档 (Ctrl+S)">保存</button>
      <select id="style-select" title="渲染风格"></select>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar">
      <nav id="file-tree"></nav>
      <div id="outline-resizer" hidden></div>
      <div id="outline-box" hidden>
        <div id="outline-title">大纲</div>
        <ul id="outline"></ul>
      </div>
    </aside>
    <div id="sidebar-resizer"></div>
    <article id="content">
      <div id="tabbar" hidden></div>
      <div id="panes" hidden>
        <div id="preview-scroll">
          <div id="viewer" class="markdown-body"></div>
        </div>
        <div id="edit-pane" hidden>
          <textarea id="editor" spellcheck="false" placeholder="在这里编辑 Markdown 源码"></textarea>
          <div id="edit-viewer" class="markdown-body"></div>
        </div>
      </div>
      <div id="close-confirm" hidden>
        <span>未保存的更改将丢失</span>
        <button id="close-discard">关闭并丢弃</button>
        <button id="close-cancel">取消</button>
      </div>
      <div id="empty">
        <p>还没有打开目录</p>
        <p class="hint">菜单 文件 → 打开文件夹 (Ctrl+Shift+O)</p>
      </div>
    </article>
  </div>

  <script src="../lib/marked.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
